[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robustvision-ai"
version = "0.1.0"
description = "Reproducible computer-vision robustness evaluation"
requires-python = ">=3.10,<3.14"
dependencies = ["torch>=2.5", "torchvision>=0.20", "numpy>=1.26", "pillow>=10", "pandas>=2.2", "scikit-learn>=1.5", "fastapi>=0.115", "uvicorn[standard]>=0.30", "streamlit>=1.39", "plotly>=5.24", "mlflow>=2.17", "pydantic>=2.9", "PyYAML>=6.0", "httpx>=0.27", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "data", "artifacts", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
[tool.ruff.lint.isort]
known-first-party = ["robustvision"]
